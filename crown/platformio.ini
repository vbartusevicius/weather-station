; Crown v2 firmware: STM32G431RBT6 (ultrasonic wind, piezo rain, AS3935 lightning) as an I2C peripheral of main.
; Host unit tests of the DSP / protocol core:  pio test -d crown -e native
; Firmware build:                              pio run -d crown -e crown
[platformio]
default_envs = crown
test_dir = test

[env]
build_unflags = -std=gnu++11 -std=gnu++14
build_flags = -std=gnu++17 -I../shared/include

[env:native]
platform = platformio/native@1.2.1
test_framework = unity
build_src_filter = -<*>
build_flags = ${env.build_flags} -Wall -Wextra -Werror
lib_deps = throwtheswitch/Unity@2.6.1

[env:crown]
platform = ststm32
board = nucleo_g431rb
framework = stm32cube
; GCC 12 has linux_aarch64 builds (the platform default 7.x does not), needed for the arm64 build container
platform_packages = platformio/toolchain-gccarmnoneeabi@~1.120301.0
upload_protocol = stlink
debug_tool = stlink
build_flags = ${env.build_flags} -DSTM32G431xx -DHSE_VALUE=8000000U -O2 -Wall -Wextra
extra_scripts = pre:scripts/fpu.py
