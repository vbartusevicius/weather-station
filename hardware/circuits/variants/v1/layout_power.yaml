  C7:  { x: 17.8 , y: 11.6 , rot: 0  , block: buck_logic }
  C8:  { x: 2.0  , y: 12.6 , rot: 90 , block: buck_logic }

  U2:  { x: 5.0,   y: 19.5,  rot: 0,   block: buck_heat }
