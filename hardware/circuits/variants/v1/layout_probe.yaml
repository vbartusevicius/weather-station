frame:
  size: { x: 14.0, y: 50.0 }
  copper_layers: 4
  thickness: 1.2
  min_drill: 0.2
  min_track: 0.12
  edge_clearance: 0.3
  silk_inside: true
  fine_pitch_power_pads: [J1, J2, U1, U2, U3, U4, Q1]
  raised_modules: []
  plane_layers: [In1.Cu]
  domains: [SELV-PROBE]
  domain_regions:
    SELV-PROBE:
      - { x0: 0.0, y0: 0.0, x1: 14.0, y1: 50.0 }
  isolators: []
  power_nets: [VIN_PROT, HEAT_SW, CO2_HEAT_SW, +3V3]
  slots:
    - { x0: 3.0, y0: 18.8, x1: 11.0, y1: 20.0 }
  copper_keepout:
    - { x0: 2.5, y0: 18.3, x1: 11.5, y1: 20.5 }
  pours:
    - { net: GND, layers: [In1.Cu], region: { x0: 0.5, y0: 0.5, x1: 13.5, y1: 49.5 } }
  no_coat_keepouts:
    - { x0: 4.2, y0: 12.2, x1: 6.8,  y1: 14.8, layer: F.SilkS }  # U3 SHT45 PTFE membrane window
    - { x0: 1.8, y0: 23.3, x1: 12.2, y1: 33.7, layer: F.SilkS }  # U1 SCD41 acoustic gas window
    - { x0: 3.9, y0: 36.4, x1: 7.1,  y1: 39.6, layer: F.SilkS }  # U2 SGP41 MOX hotplate aperture
  silk_labels:
    - { text: "MAIN",      x: 7.0, y: 8.2,  layer: F.SilkS }
    - { text: "REFLECTOR", x: 7.0, y: 42.8, layer: F.SilkS }

heights:
  default: 1.2
  J1: 4.25
  J2: 2.5
  U1: 6.5
  U2: 0.9
  U3: 0.5
  U4: 1.65
  Q1: 1.1
  R1: 0.7
  R2: 0.7
  TH1: 0.6

