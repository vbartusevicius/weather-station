frame:
  size: { x: 14.0, y: 56.0 }   # 6 mm longer: J2 reaches the reflector under the raised wind_tunnel deck
  copper_layers: 4
  thickness: 1.6
  min_drill: 0.2
  min_track: 0.12
  edge_clearance: 0.3
  silk_inside: true
  fine_pitch_power_pads: [J1, J2, U1, U2, U3, U4, U5, Q1]
  raised_modules: []
  plane_layers: [In1.Cu]
  domains: [SELV-PROBE]
  domain_regions:
    SELV-PROBE:
      - { x0: 0.0, y0: 0.0, x1: 14.0, y1: 56.0 }
  isolators: []
  power_nets: [HEAT_SW, CO2_HEAT_SW, CO2_HEAT_RTN, +12V_HEAT, +3V3_PROBE]
  # Two milled thermal slots: SCD41 heater zone | SHT40 | J1 (base-bay side). Heat reaching the SHT40 through the
  # board / In1 ground plane must pass the 2 mm side bridges (checklist P2).
  slots:
    - { x0: 3.0, y0: 18.8, x1: 11.0, y1: 20.0 }
    - { x0: 3.0, y0: 9.0, x1: 11.0, y1: 10.2 }
  copper_keepout:
    - { x0: 2.5, y0: 18.3, x1: 11.5, y1: 20.5 }
    - { x0: 2.5, y0: 8.5, x1: 11.5, y1: 10.7 }
  pours:
    - { net: GND, layers: [In1.Cu], region: { x0: 0.5, y0: 0.5, x1: 13.5, y1: 55.5 } }
  no_coat_keepouts:
    - { x0: 4.2, y0: 12.2, x1: 6.8,  y1: 14.8, layer: F.SilkS }  # U3 SHT40 PTFE membrane window
    - { x0: 1.8, y0: 23.3, x1: 12.2, y1: 33.7, layer: F.SilkS }  # U1 SCD41 acoustic gas window
    - { x0: 2.4, y0: 36.4, x1: 5.6,  y1: 39.6, layer: F.SilkS }  # U2 SGP41 MOX hotplate aperture
    - { x0: 8.0, y0: 35.9, x1: 12.0, y1: 39.9, layer: F.SilkS }  # U5 BMP585 gel pressure port
  connector_labels: { J1: "MAIN", J2: "REFL" }   # destination board / port, placed next to each connector
  silk_labels: []

heights:
  default: 1.2
  J1: 4.25
  J2: 2.5
  U1: 6.5
  U2: 0.9
  U3: 0.5
  U5: 1.96
  U4: 1.65
  Q1: 1.1
  R1: 0.7
  R2: 0.7
  TH1: 0.6

parts:
  # --- Front (+z): Bottom SHT40 intake zone + SCD41 CO2 zone + upper SGP41/BMP585 zone + Top 4-pin 2.54 mm T-header J2 ---
  J1:  { x: 7.0,   y: 4.5,   rot: 0,   block: int_main, locked: true }
  U3:  { x: 5.5,   y: 13.5,  rot: 0,   block: thermo_hygro, locked: true }
  C5:  { x: 10.0,  y: 13.5,  rot: 90,  block: thermo_hygro }

  C1:  { x: 3.0,   y: 22.0,  rot: 0,   block: air_quality }
  C2:  { x: 10.5,  y: 22.0,  rot: 0,   block: air_quality }
  U1:  { x: 7.0,   y: 28.5,  rot: 0,   block: air_quality, locked: true }
  U2:  { x: 4.0,   y: 38.0,  rot: 0,   block: air_quality, locked: true }
  C4:  { x: 4.0,   y: 41.0,  rot: 0,   block: air_quality }
  U5:  { x: 10.0,  y: 37.9,  rot: 0,   block: baro, locked: true }
  C6:  { x: 10.0,  y: 41.0,  rot: 0,   block: baro }

  J2:  { x: 7.0,   y: 52.5,  rot: 0,   block: int_reflector, locked: true }

  # --- Back (-z): 0.5 W Parallel 1206 Heater (R1 || R2) + TH1 NTC + LM393 (U4) + AO3400A (Q1) Closed-Loop Thermostat ---
  R1:  { x: 7.0,   y: 25.0,  rot: 0,   side: back, block: co2_back_heater, locked: true }
  TH1: { x: 7.0,   y: 28.0,  rot: 0,   side: back, block: co2_back_heater, locked: true }
  R2:  { x: 7.0,   y: 31.0,  rot: 0,   side: back, block: co2_back_heater, locked: true }
  R3:  { x: 2.3,   y: 26.5,  rot: 90,  side: back, block: co2_back_heater }
  R4:  { x: 11.7,  y: 26.5,  rot: 90,  side: back, block: co2_back_heater }
  R5:  { x: 11.7,  y: 31.0,  rot: 90,  side: back, block: co2_back_heater }
  R7:  { x: 2.3,   y: 31.0,  rot: 90,  side: back, block: co2_back_heater }   # thermostat hysteresis
  U4:  { x: 6.5,   y: 36.5,  rot: 90,  side: back, block: co2_back_heater }
  C3:  { x: 11.7,  y: 36.5,  rot: 90,  side: back, block: co2_back_heater }
  R6:  { x: 3.0,   y: 42.0,  rot: 0,   side: back, block: co2_back_heater }
  Q1:  { x: 9.8,   y: 42.2,  rot: 0,   side: back, block: co2_back_heater }
