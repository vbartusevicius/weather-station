frame:
  size: { x: 41.0, y: 56.0 }
  copper_layers: 4
  thickness: 1.2
  min_drill: 0.2
  min_track: 0.12
  edge_clearance: 0.3
  silk_inside: true
  fine_pitch_power_pads: [U1, U2, U4, U5, U6, U7, U8, J2, J3, J4, R1, R5]
  raised_modules: [U3]
  plane_layers: [In1.Cu]
  domains: [SELV-MAIN]
  domain_regions:
    SELV-MAIN:
      - { x0: 0.0, y0: 0.0, x1: 41.0, y1: 56.0 }
  isolators: []
  power_nets: [VIN_RAW, VIN_FUSED, VIN_PROT, HEAT_SW, +5V, +5V_XIAO]
  pours:
    - { net: GND, layers: [In1.Cu], region: { x0: 0.5, y0: 0.5, x1: 40.5, y1: 55.5 } }
  no_coat_keepouts:
    - { x0: 4.8, y0: 17.3, x1: 8.2, y1: 20.7, layer: B.SilkS }   # U4 BMP581 MEMS pressure port

heights:
  default: 1.2
  J1: 11.0
  F1: 1.2
  D1: 2.0
  D2: 2.0
  D3: 2.0
  C1: 1.3
  U1: 1.1
  L1: 1.5
  Q1: 1.1
  U2: 1.0
  U3: 11.0
  SW1: 1.5
  U7: 1.65
  U8: 1.15
  U4: 0.8
  U5: 0.9
  U6: 0.9
  L2: 4.5
  J4: 4.5
  J2: 4.25
  J3: 4.25

