frame:
  size: { x: 32.0, y: 52.0 }
  copper_layers: 4
  thickness: 1.6
  min_drill: 0.2
  min_track: 0.12
  edge_clearance: 0.3
  silk_inside: true
  fine_pitch_power_pads: [U2, U4, U5, U7, J2, J3, J4, J5, R1]
  raised_modules: [U3]
  plane_layers: [In1.Cu]
  domains: [SELV-MAIN]
  domain_regions:
    SELV-MAIN:
      - { x0: 0.0, y0: 0.0, x1: 32.0, y1: 52.0 }
  isolators: []
  power_nets: [VIN_RAW, VIN_FUSED, VIN_PROT, HEAT_SW, HEAT_SENSE, CO2_HEAT_RTN, +5V, +12V_HEAT, +5V_XIAO, +3V3_PROBE]
  # 0.4 mm (was 0.3): VIN carries up to ~0.9 A at a 12 V input with both heaters on and may run on a 0.5 oz inner
  # layer (~+10-15 K instead of ~+20-25 K at 0.3 mm, IPC-2152); 0.4 mm still enters the 1.0 mm-pitch JST-SH pads.
  power_track_width: 0.4
  pours:
    - { net: GND, layers: [In1.Cu], region: { x0: 0.5, y0: 0.5, x1: 31.5, y1: 51.5 } }
  no_coat_keepouts: []
  # Concise Silkscreen Connection Labels (`F.SilkS` & `B.SilkS`):
  connector_labels: { J2: "CROWN", J3: "PROBE", J4: "PM", J5: "POWER" }   # destination board / port, placed next to each connector
  silk_labels:
    # J1 pin labels: J1 is rotated 180 deg, so pin 4 (B-) is on the left and pin 1 (+V) on the right
    - { text: "B-",  x: 3.35,  y: 14.4, layer: F.SilkS }
    - { text: "A+",  x: 6.85,  y: 14.4, layer: F.SilkS }
    - { text: "GND", x: 10.35, y: 14.4, layer: F.SilkS }
    - { text: "+V",  x: 13.85, y: 14.4, layer: F.SilkS }
    - { text: "RST",             x: 19.0, y: 10.4, layer: B.SilkS }

heights:
  default: 1.2
  J1: 11.0
  F1: 1.6
  D1: 2.0
  D2: 2.0
  D3: 2.0
  C1: 1.6
  Q1: 1.1
  U2: 1.0
  U3: 11.0
  SW1: 1.5
  U7: 1.65
  U5: 0.9
  D4: 1.1
  J4: 4.5
  J5: 4.25
  J2: 4.25
  J3: 4.25

parts:
  # 32 x 52 mm main board on the right half of the base bay (enc x = -0.5..31.5); the PMSA003I lies on the left.
  # --- Front (+y): 4-pole push-in terminal J1 (12-32 V + RS-485) at the front edge, input protection row ---
  J1:  { x: 8.6,   y: 7.0,   rot: 180, block: power_in, locked: true }
  F1:  { x: 19.6,  y: 7.0,   rot: 90,  block: power_in }   # 2920 60 V PTC (7.4 x 5.1 mm)
  D1:  { x: 24.6,  y: 7.0,   rot: 90,  block: power_in }
  D2:  { x: 28.6,  y: 7.0,   rot: 90,  block: power_in }
  C1:  { x: 29.4,  y: 12.6,  rot: 0,   block: power_in }

  # XIAO ESP32-C6 on 5.0 mm sockets (both 5 V rails now come from the `power` board under main, via J5)
  U3:  { x: 10.0,  y: 25.0,  rot: 0,   block: mcu, locked: true }
  J5:  { x: 28.6,  y: 21.5,  rot: 90,  block: int_power, locked: true }   # 8-pin power cable from the power board

  U2:  { x: 23.5,  y: 14.6,  rot: 0,   block: mcu_power }
  C4:  { x: 23.5,  y: 17.0,  rot: 0,   block: mcu_power }
  R5:  { x: 23.5,  y: 19.0,  rot: 0,   block: mcu }
  R6: { x: 23.5,  y: 21.0,  rot: 0,   block: mcu }
  R7: { x: 23.5,  y: 23.0,  rot: 0,   block: mcu }
  C5: { x: 23.5,  y: 25.0,  rot: 0,   block: mcu }

  SW1: { x: 19.0,  y: 6.0,   rot: 90,  side: back, block: mcu, locked: true }   # over the base button at enc (+18.5, -20.0)
  U7:  { x: 5.0,   y: 44.5,  rot: 0,   block: rs485 }
  C7: { x: 11.0,  y: 50.1,  rot: 0,   block: rs485 }
  R8: { x: 11.0,  y: 43.5,  rot: 0,   block: rs485 }
  R9: { x: 11.0,  y: 45.7,  rot: 0,   block: rs485 }
  R10: { x: 11.0,  y: 47.9,  rot: 0,   block: rs485 }
  C8: { x: 2.6,   y: 38.0,  rot: 0,   block: rs485 }
  R26: { x: 12.0,  y: 39.0,  rot: 0,   block: rs485 }   # optional 120R terminator (hand-fit at a bus end only)

  J2:  { x: 23.5,  y: 48.3,  rot: 0,   block: int_crown, locked: true }
  J3:  { x: 24.5,  y: 42.5,  rot: 0,   block: int_probe, locked: true }
  J4:  { x: 24.5,  y: 35.5,  rot: 0,   block: pm_sensor, locked: true }
  C13: { x: 30.6,  y: 30.0,  rot: 90,  block: pm_sensor }

  # --- Back (-y): input sense, heater MOSFET, 6-Axis IMU (clear of the XIAO socket pins) ---
  R1:  { x: 25.0,  y: 14.0,  rot: 0,   side: back, block: vin_sense }
  R2:  { x: 25.0,  y: 16.5,  rot: 0,   side: back, block: vin_sense }
  C3:  { x: 25.0,  y: 19.0,  rot: 0,   side: back, block: vin_sense }
  Q1:  { x: 28.5,  y: 22.0,  rot: 0,   side: back, block: heater_drv }
  R3:  { x: 21.5,  y: 21.0,  rot: 0,   side: back, block: heater_drv }
  R4:  { x: 21.5,  y: 23.5,  rot: 0,   side: back, block: heater_drv }
  D3:  { x: 25.0,  y: 27.5,  rot: 0,   side: back, block: heater_drv }

  R16: { x: 30.2,  y: 26.0,  rot: 90,  side: back, block: heater_mon }   # reflector heater 0.1 ohm shunt

  # --- Back: ADS1115 heater power monitor (filters between the XIAO socket pin rows, ADC next to the IMU) ---
  U4:  { x: 9.5,   y: 37.0,  rot: 90,  side: back, block: heater_mon }
  C21: { x: 14.5,  y: 37.0,  rot: 90,  side: back, block: heater_mon }
  R20: { x: 4.0,   y: 36.5,  rot: 90,  side: back, block: heater_mon }
  R21: { x: 4.0,   y: 40.0,  rot: 90,  side: back, block: heater_mon }
  R24: { x: 5.0,   y: 43.5,  rot: 90,  side: back, block: heater_mon }
  R25: { x: 5.0,   y: 47.0,  rot: 90,  side: back, block: heater_mon }
  R17: { x: 6.5,   y: 27.5,  rot: 90,  side: back, block: heater_mon }
  R19: { x: 9.0,   y: 27.5,  rot: 90,  side: back, block: heater_mon }
  C20: { x: 9.0,   y: 31.5,  rot: 90,  side: back, block: heater_mon }
  R18: { x: 13.5,  y: 26.0,  rot: 90,  side: back, block: heater_mon }
  C19: { x: 13.5,  y: 30.0,  rot: 90,  side: back, block: heater_mon }

  U5:  { x: 8.0,   y: 46.0,  rot: 0,   side: back, block: imu }
  C9: { x: 8.0,   y: 42.5,  rot: 0,   side: back, block: imu }

  D4:  { x: 8.6,   y: 11.8,  rot: 0,   side: back, block: rs485 }       # SM712 RS-485 TVS next to J1
