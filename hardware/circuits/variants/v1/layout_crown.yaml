frame:
  size: { x: 34.0, y: 34.0 }
  # Compact 34.0 x 34.0 mm Square Outline with 4.5 mm 45-deg corner chamfers (corner radius = 20.8 mm!)
  # so all 4 inward-angled ultrasonic barrels (at r = 25.5 mm) and all 4 square struts (at r = 31.0 mm)
  # sit 100% outside the `crown` PCB with full top-down insertion clearance!
  outline:
    - [4.5,  0.0]
    - [29.5, 0.0]
    - [34.0, 4.5]
    - [34.0, 29.5]
    - [29.5, 34.0]
    - [4.5,  34.0]
    - [0.0,  29.5]
    - [0.0,  4.5]
  copper_layers: 4
  thickness: 1.2
  min_drill: 0.2
  min_track: 0.12
  edge_clearance: 0.3
  silk_inside: true
  fine_pitch_power_pads: [J1, J2, J3, J4, J5, J6, J7, J8, J9, J10, U1, U2, U3, U4, U5, U6]
  raised_modules: []
  plane_layers: [In1.Cu]
  domains: [SELV-CROWN]
  domain_regions:
    SELV-CROWN:
      - { x0: 0.0, y0: 0.0, x1: 34.0, y1: 34.0 }
  isolators: []
  power_nets: [+5V, +3V3]
  pours:
    - { net: GND, layers: [In1.Cu], region: { x0: 0.5, y0: 0.5, x1: 33.5, y1: 33.5 } }
  # Explicit Top Silkscreen (`F.SilkS`) Connector Labels distinguishing the 4 Ultrasonic Wind connectors
  # (`US_N/E/S/W` at the N/E/S/W mid-edges) from the 4 Piezo Rain connectors (`PZ_NE/NW/SW/SE` near the 4 corners)!
  silk_labels:
    - { text: "US_N",  x: 12.2, y: 31.8, layer: F.SilkS }
    - { text: "US_E",  x: 31.5, y: 22.0, layer: F.SilkS }
    - { text: "US_S",  x: 12.2, y: 2.2,  layer: F.SilkS }
    - { text: "US_W",  x: 2.5,  y: 22.0, layer: F.SilkS }
    - { text: "PZ_NE", x: 27.5, y: 31.8, layer: F.SilkS }
    - { text: "PZ_NW", x: 6.5,  y: 31.8, layer: F.SilkS }
    - { text: "PZ_SW", x: 6.5,  y: 2.2,  layer: F.SilkS }
    - { text: "PZ_SE", x: 27.5, y: 2.2,  layer: F.SilkS }

heights:
  default: 1.2
  J1: 4.25
  J2: 4.25
  J3: 4.25
  J4: 4.25
  J5: 4.25
  J6: 4.25
  J7: 4.25
  J8: 4.25
  J9: 4.25
  J10: 11.5
  U1: 1.15
  U2: 1.65
  U3: 1.65
  U4: 1.65
  U5: 1.65
  U6: 0.8

parts:
  # --- Front (+y, F.Cu at y = 182.8 mm): ALL 10 connectors on TOP (`F.Cu`) for effortless top-down plug-in!
  #     - `J2..J5` (`US_N, US_E, US_S, US_W`) at the N/E/S/W mid-edges right beside the 4 angled ultrasonic barrels!
  #     - `J6..J9` (`PZ_NE, PZ_NW, PZ_SW, PZ_SE`) near the 4 corners!
  #     - `J10` at exact center (17.0, 17.0) and `J1` (10-pin main cable) at (17.0, 10.2)! ---
  J1:  { x: 17.0,  y: 10.2,  rot: 0,   block: int_main, locked: true }
  J10: { x: 17.0,  y: 17.0,  rot: 0,   block: int_dome, locked: true }

  # 4x 2-Pin JST-SH Ultrasonic Transducer Headers (`US_N`, `US_E`, `US_S`, `US_W`) on TOP (`F.Cu`)!
  J2:  { x: 17.0,  y: 30.8,  rot: 0,   block: us_transducers, locked: true }
  J3:  { x: 30.8,  y: 17.0,  rot: -90, block: us_transducers, locked: true }
  J4:  { x: 17.0,  y: 3.2,   rot: 180, block: us_transducers, locked: true }
  J5:  { x: 3.2,   y: 17.0,  rot: 90,  block: us_transducers, locked: true }

  # 4x 2-Pin JST-SH Piezo Rain Headers (`PZ_NE`, `PZ_NW`, `PZ_SW`, `PZ_SE`) on TOP (`F.Cu`)!
  J6:  { x: 27.5,  y: 28.0,  rot: 0,   block: rain_afe, locked: true }
  J7:  { x: 6.5,   y: 28.0,  rot: 0,   block: rain_afe, locked: true }
  J8:  { x: 6.5,   y: 5.5,   rot: 180, block: rain_afe, locked: true }
  J9:  { x: 27.5,  y: 5.5,   rot: 180, block: rain_afe, locked: true }

  U6:  { x: 17.0,  y: 23.5,  rot: 0,   block: compass, locked: true }
  C14: { x: 20.5,  y: 23.5,  rot: 90,  block: compass }

  U5:  { x: 9.0,   y: 21.5,  rot: 0,   block: rain_afe }
  C11: { x: 9.0,   y: 16.5,  rot: 0,   block: rain_afe }
  R13: { x: 25.5,  y: 22.5,  rot: 0,   block: rain_afe }
  R14: { x: 25.5,  y: 20.0,  rot: 0,   block: rain_afe }
  C12: { x: 25.5,  y: 17.5,  rot: 0,   block: rain_afe }
  R15: { x: 25.5,  y: 15.0,  rot: 0,   block: rain_afe }
  R16: { x: 25.5,  y: 12.5,  rot: 0,   block: rain_afe }
  R17: { x: 13.0,  y: 25.0,  rot: 0,   block: rain_afe }
  C13: { x: 13.0,  y: 22.5,  rot: 0,   block: rain_afe }

  # --- Back (-y, B.Cu): ONLY low-profile SMD ICs (`<= 1.65 mm` height) & 0603 passives (ZERO connectors on B.Cu!) ---
  U2:  { x: 17.0,  y: 10.0,  rot: 0,   side: back, block: us_afe }
  C3:  { x: 24.0,  y: 10.0,  rot: 90,  side: back, block: us_afe }
  U1:  { x: 8.5,   y: 10.0,  rot: 0,   side: back, block: us_afe }
  C1:  { x: 8.5,   y: 5.5,   rot: 0,   side: back, block: us_afe }
  C2:  { x: 8.5,   y: 14.5,  rot: 0,   side: back, block: us_afe }
  R1:  { x: 12.0,  y: 16.5,  rot: 0,   side: back, block: us_afe }

  U3:  { x: 23.0,  y: 20.0,  rot: 0,   side: back, block: us_afe }
