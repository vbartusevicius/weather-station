# Single source of truth for the Roof Weather Station PCBs (`main`, `crown`, `probe`)
# and the 3D-printed cylindrical aerodynamic enclosure (`base`, `pagoda`, `crown`).
# Units: millimetres. Coordinate system (installed vertical cylinder on roof mast):
#   x = West (-) -> East (+), centred at 0.0 (-48.0 .. +48.0)
#   y = vertical height from bottom of mast socket (0.0) -> top of rain/UV dome (198.0)
#   z = South (-) -> North (+), centred at 0.0 (-48.0 .. +48.0)

product:
  name: AeroMet Roof Weather Station
  revision: A
  release: v1
  status: draft-unvalidated

active_variant: v1

envelope:
  outer_diameter: 96.0
  outer_radius: 48.0
  total_height: 213.0
  # Everything above the base (pagoda, probe, reflector, struts, crown, dome) is designed in the original frame and
  # placed `above_base_raise` higher: the base bay grew by 15 mm (taller power/PM/main stack, more airflow room).
  above_base_raise: 15.0
  wall: 2.0
  mast_socket:
    y_start: 0.0
    y_end: 32.0
    outer_diameter: 44.0
    inner_diameter: 34.0       # fits standard 25.4..34.0 mm (1" to 1-1/4") roof mast with M4 clamp bolts
    cable_pass_through_diameter: 10.0
  base_bay:
    y_start: 32.0
    y_end: 83.0
    floor_y: 34.0
    ceiling_y: 81.0
    inner_diameter: 92.0
  pagoda_shield:
    y_start: 68.0
    y_end: 126.0
    plates: 5
    plate_ys: [74.0, 85.0, 96.0, 107.0, 118.0]
    outer_diameter: 96.0
    inner_core_diameter: 36.0
  wind_tunnel:
    y_start: 126.0
    y_end: 174.0
    acoustic_gap_mm: 48.0
    reflector_apex_y: 130.0
    strut_angles_deg: [45, 135, 225, 315]
    strut_radius: 31.0
    strut_chord: 9.0
    strut_thickness: 5.5
    cable_conduit_strut_deg: 45
    transducer_radius: 25.5
    transducer_tilt_deg: 29.0
    transducer_angles_deg: { N: 90, E: 0, S: 270, W: 180 }
  top_crown:
    y_start: 174.0
    y_end: 198.0
    floor_y: 174.0
    dome_apex_y: 198.0
    uv_window_diameter: 8.0
    piezo_disc_diameter: 27.0

enclosure:
  material: ASA-UV-stabilized
  wall: 2.0
  min_clearance_to_pcb: 0.5
  parts: [base, pagoda, crown]
  fasteners: "4 x M3x12 stainless socket head screws joining base->pagoda and pagoda->crown + 2 x M4x16 mast clamp bolts"

variants:
  v1:
    description: "Monolithic solid-state ultrasonic, haptic-rain & multi-gas air-quality roof weather station (12-32V wired)"
    boards: [main, crown, reflector, dome, probe, power]

boards:
  main:
    plane: horizontal-xz     # enc_x = board_x - 0.5, enc_z = board_y - 26.0 (right half of the bay), top faces +y
    thickness: 1.2
    y: 56.5                  # board top face y (raised 10 mm with the taller bay: 6.8+ mm above the power board)
    x_offset: 15.5           # board spans enc x = -0.5..31.5; the PMSA003I lies flat on the left half
    max_outline: { width: 32.0, height: 52.0 }
    domains:
      SELV-MAIN: all
  crown:
    plane: horizontal-xz     # compact 34.0 x 34.0 mm square-chamfered board at y = 182.8 mm (corner r = 20.8 mm, 100% inside the 4 ultrasonic barrels & 4 struts!)
    shape: octagon
    thickness: 1.2
    y: 182.8
    max_outline: { width: 34.0, height: 34.0 }
    domains:
      SELV-CROWN: all
  power:
    plane: horizontal-xz     # 28.5 x 30 mm two-rail power supply lying flat 1 mm above the bay floor, under `main`
    thickness: 1.2
    y: 41.7                  # board top face y (bottom face at 40.5, 6 mm above the y = 34.5 floor); inductors end at 46.2
    x_offset: 23.75          # board spans enc x = 9.5..38.0 (clear of the gland locknut, juts past main's edge for J1)
    z_offset: 1.0            # board spans enc z = -14.0..16.0 (clear of the reset button and main's L2)
    max_outline: { width: 28.5, height: 30.0 }
    domains:
      SELV-POWER: all
  reflector:
    plane: horizontal-xz     # compact 24x24 mm horizontal T-cap directly under the wind-tunnel reflector apex (y = 123.8)
    thickness: 1.2
    y: 123.8                 # board top face y (bottom face at 122.6); 4x 2512 parallel heater array
    max_outline: { width: 24.0, height: 24.0 }
    domains:
      SELV-REFLECTOR: all
  dome:
    plane: horizontal-xz     # round Ø 13.6 mm UV/Light micro-PCB raised on 4-pin vertical B2B riser right inside the JGS1 hemisphere!
    shape: circle
    thickness: 1.2
    y: 197.4                 # U1 (LTR-390UV) & U2 (VEML7700) sit at y = 197.4..200.4 inside the hollow JGS1 hemisphere above the y=197.8 lip
    x_offset: 0.0
    z_offset: 0.0
    max_outline: { width: 13.6, height: 13.6 }
    domains:
      SELV-DOME: all
  probe:
    plane: vertical-xy       # vertical stem of the T inside the 5-plate pagoda (y = 69.0..119.0)
    thickness: 1.2
    y_start: 69.0
    z: 0.6                   # front face at +0.6, back face at -0.6
    max_outline: { width: 14.0, height: 50.0 }
    domains:
      SELV-PROBE: all
  interconnects:
    - from: main
      to: crown
      signals: [+5V, +3V3, GND, I2C_SDA, I2C_SCL, US_SEL_A, US_SEL_B, US_TX, US_RX, RAIN_ADC, +5V_HEAT, GND]
      refs: { main: J2, crown: J1 }
      domain: SELV-MAIN
      type: cable
      pins: 12
      connector_pitch: 1.0
      cable_length_mm: 160.0
    - from: crown
      to: dome
      signals: [+3V3, GND, I2C_SDA, I2C_SCL]
      refs: { crown: J10, dome: J1 }
      domain: SELV-CROWN
      type: b2b_header
      pins: 4
      connector_pitch: 2.54
      cable_length_mm: 28.0
    - from: main
      to: probe
      signals: [+5V_HEAT, +5V_HEAT, HEAT_SW, HEAT_SW, GND, NTC_SENSE, +3V3, CO2_HEAT_RTN, I2C_SDA, I2C_SCL]
      refs: { main: J3, probe: J1 }
      domain: SELV-MAIN
      type: cable
      pins: 10
      connector_pitch: 1.0
      cable_length_mm: 60.0
    - from: main
      to: power
      signals: [VIN_PROT, VIN_PROT, GND, GND, +5V, +5V, +5V_HEAT, +5V_HEAT]
      refs: { main: J5, power: J1 }
      domain: SELV-MAIN
      type: cable
      pins: 8
      connector_pitch: 1.0
      cable_length_mm: 60.0
    - from: probe
      to: reflector
      signals: [+5V_HEAT, HEAT_SW, NTC_SENSE, GND]
      refs: { probe: J2, reflector: J1 }
      domain: SELV-PROBE
      type: b2b_header
      pins: 4
      connector_pitch: 2.54
      cable_length_mm: 20.0

terminals:
  power_in:
    board: main
    poles: 2
    pitch: 5.08
    type: push-in-spring (Cixi Kefa KF142R-5.08-2P)
    labels: [VIN_12_32V, GND]
  pm_sensor:
    board: main
    poles: 6
    pitch: 1.5
    type: jst-zh-smd (JST B6B-ZR-SM4-TF -> harness -> Plantower PMSA003I 2x5 1.27 mm)
    labels: [+5V, GND, I2C_SDA, I2C_SCL, NC, NC]

checks:
  component_air_gap: 1.5
  component_to_cover_min_gap: 0.8

