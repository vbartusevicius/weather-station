# Single source of truth for the Roof Weather Station PCBs (`main`, `crown`, `probe`)
# and the 3D-printed cylindrical aerodynamic enclosure (`base`, `pagoda`, `crown`).
# Units: millimetres. Coordinate system (installed vertical cylinder on roof mast):
#   x = West (-) -> East (+), centred at 0.0 (-48.0 .. +48.0)
#   y = vertical height from bottom of mast socket (0.0) -> top of rain/UV dome (198.0)
#   z = South (-) -> North (+), centred at 0.0 (-48.0 .. +48.0)

product:
  name: AeroMet Roof Weather Station
  revision: A
  release: v1
  status: draft-unvalidated

active_variant: v1

envelope:
  outer_diameter: 96.0
  outer_radius: 48.0
  total_height: 235.2          # y = -12 (bottom of the 40 mm mast clamp) .. 223.2 (PTFE dome top, lathe version; CNC 226.1)
  # Everything above the base (pagoda, probe, reflector, struts, crown, dome) is designed in the original frame and
  # placed `above_base_raise` higher: the base bay grew by 15 mm (taller power/PM/main stack, more airflow room).
  above_base_raise: 15.0
  # The wind_tunnel deck and everything above it (struts, crown_base, crown, reflector/crown/dome boards) sit a further
  # `above_pagoda_raise` higher: a 10.4 mm (was 4.4 mm) cable/service gap between the pagoda top and the wind_tunnel deck
  # for the crown cable; the probe board is 6 mm longer so its J2 still carries the reflector board under the deck.
  above_pagoda_raise: 6.0
  wall: 2.0
  mast_socket:
    y_start: -12.0           # mast clamp 40 mm tall from the base underside (y = 28): 31 mm of pole engagement (pole stop at y = 19)
    y_end: 32.0
    outer_diameter: 44.0
    inner_diameter: 34.0       # Ø 32..34 mm poles direct, Ø 24..32 mm with mast_shims; 6x M6 clamp bolts in 3 rows
    cable_pass_through_diameter: 10.0
  base_bay:
    y_start: 32.0
    y_end: 83.0
    floor_y: 34.0
    ceiling_y: 81.0
    inner_diameter: 92.0
  pagoda_shield:
    y_start: 68.0
    y_end: 126.0
    plates: 5
    plate_ys: [74.0, 85.0, 96.0, 107.0, 118.0]
    outer_diameter: 96.0
    inner_core_diameter: 36.0
  wind_tunnel:
    y_start: 126.0
    y_end: 174.0
    acoustic_gap_mm: 48.0
    reflector_apex_y: 130.0
    strut_angles_deg: [45, 135, 225, 315]
    strut_radius: 31.0
    strut_chord: 9.0
    strut_thickness: 5.5
    cable_conduit_strut_deg: 45
    transducer_radius: 25.5
    transducer_tilt_deg: 29.0
    transducer_angles_deg: { N: 90, E: 0, S: 270, W: 180 }
  top_crown:
    y_start: 174.0
    y_end: 198.0
    floor_y: 174.0
    dome_apex_y: 198.0
    uv_window_diameter: 8.0
    piezo_disc_diameter: 27.0

enclosure:
  material: ASA-UV-stabilized
  wall: 2.0
  min_clearance_to_pcb: 0.5
  parts: [base, pagoda, crown]
  fasteners: "4 x M3x12 stainless socket head screws joining base->pagoda and pagoda->crown + 2 x M4x16 mast clamp bolts"

variants:
  v1:
    description: "Monolithic solid-state ultrasonic, haptic-rain & multi-gas air-quality roof weather station (12-32V wired)"
    boards: [main, crown, reflector, dome, probe, power]
    # Built, routed, released and tested like the others, but not in the enclosure model, the panel or the order files:
    # alternatives that fit the same place (dome_legacy = the LTR-390UV + GUVB-C31SM dome, same riser and outline).
    legacy_boards: [dome_legacy]

boards:
  main:
    plane: horizontal-xz     # enc_x = board_x - 0.5, enc_z = board_y - 26.0 (right half of the bay), top faces +y
    thickness: 1.6
    y: 56.9                  # board top face y (1.6 mm board, underside at 55.3 as with the 1.2 mm board: SW1 / reset plunger)
    x_offset: 15.5           # board spans enc x = -0.5..31.5; the PMSA003I lies flat on the left half
    max_outline: { width: 32.0, height: 52.0 }
    domains:
      SELV-MAIN: all
  crown:
    plane: horizontal-xz     # 60 x 60 mm crown v2 at y = 182.8 mm: N/E/S/W notches for the transducer barrels, NE corner clear of the cable column (outline in layout_crown.yaml)
    thickness: 1.6
    y: 182.8
    max_outline: { width: 60.0, height: 60.0 }
    domains:
      SELV-CROWN: all
  power:
    plane: horizontal-xz     # 28.5 x 21.5 mm two-rail power supply lying flat under `main`
    thickness: 1.6
    y: 41.7                  # board top face y (bottom face at 40.5, 6 mm above the y = 34.5 floor); inductors end at 46.2
    x_offset: 23.75          # board spans enc x = 9.5..38.0 (clear of the gland locknut, juts past main's edge for J1)
    z_offset: -3.25          # board spans enc z = -14.0..7.5 (clear of the reset button and main's L2)
    max_outline: { width: 28.5, height: 21.5 }
    domains:
      SELV-POWER: all
  reflector:
    plane: horizontal-xz     # compact 24x24 mm horizontal T-cap directly under the wind-tunnel reflector apex (y = 123.8)
    thickness: 1.6
    y: 123.8                 # board top face y (bottom face at 122.6); 4x 2512 parallel heater array
    max_outline: { width: 24.0, height: 24.0 }
    domains:
      SELV-REFLECTOR: all
  dome:
    plane: horizontal-xz     # round Ø 15.6 mm UV-A / UV-B / light micro-PCB (PTFE dome bore Ø 16.2) raised on 4-pin vertical B2B riser right under the Ø 20 x 2 mm JGS1 window in the crown lid boss
    shape: circle
    thickness: 1.6
    y: 197.4                 # sensor tops at y <= 198.8, 0.5 mm below the UV window (build_enclosure.UV_WIN)
    x_offset: 0.0
    z_offset: 0.0
    max_outline: { width: 15.6, height: 15.6 }
    domains:
      SELV-DOME: all
  dome_legacy:
    plane: horizontal-xz     # round Ø 13.6 mm UV/Light micro-PCB raised on 4-pin vertical B2B riser right under the Ø 20 x 2 mm JGS1 window in the crown lid boss
    shape: circle
    thickness: 1.6
    y: 197.4                 # sensor tops at y <= 198.8, 0.5 mm below the UV window (build_enclosure.UV_WIN)
    x_offset: 0.0
    z_offset: 0.0
    max_outline: { width: 13.6, height: 13.6 }
    domains:
      SELV-DOME: all
  probe:
    plane: vertical-xy       # vertical stem of the T inside the 5-plate pagoda (y = 69.0..125.0)
    thickness: 1.6
    y_start: 69.0
    z: 0.8                   # front face at +0.8, back face at -0.8 (1.6 mm board)
    max_outline: { width: 14.0, height: 56.0 }   # 6 mm longer (above_pagoda_raise) so J2 reaches the raised reflector
    domains:
      SELV-PROBE: all
  interconnects:
    - from: main
      to: crown
      signals: [+12V_HEAT, +12V_HEAT, GND, GND, +5V, GND, I2C_SDA, GND, I2C_SCL, CROWN_IRQ, CROWN_NRST, CROWN_BOOT0]
      refs: { main: J2, crown: J1 }
      domain: SELV-MAIN
      type: cable
      pins: 12
      connector_pitch: 1.0
      cable_length_mm: 260.0     # BOM: 260 mm 12-conductor cable (routed path ~224 mm + service loop)
    - from: crown
      to: dome
      signals: [+3V3, GND, I2C_SDA, I2C_SCL]
      refs: { crown: J10, dome: J1 }
      domain: SELV-CROWN
      type: b2b_header
      pins: 4
      connector_pitch: 2.54
      cable_length_mm: 28.0
    - from: main
      to: probe
      signals: [+12V_HEAT, +12V_HEAT, HEAT_SW, HEAT_SW, GND, NTC_SENSE, +3V3_PROBE, CO2_HEAT_RTN, I2C_SDA, I2C_SCL]
      refs: { main: J3, probe: J1 }
      domain: SELV-MAIN
      type: cable
      pins: 10
      connector_pitch: 1.0
      cable_length_mm: 60.0
    - from: main
      to: power
      signals: [VIN_PROT, VIN_PROT, GND, GND, +5V, +5V, +12V_HEAT, +12V_HEAT, GND, +3V3_PROBE]
      refs: { main: J5, power: J1 }
      domain: SELV-MAIN
      type: cable
      pins: 10
      connector_pitch: 1.0
      cable_length_mm: 60.0
    - from: probe
      to: reflector
      signals: [+12V_HEAT, HEAT_SW, NTC_SENSE, GND]
      refs: { probe: J2, reflector: J1 }
      domain: SELV-PROBE
      type: b2b_header
      pins: 4
      connector_pitch: 2.54
      cable_length_mm: 20.0

terminals:
  power_in:
    board: main
    poles: 4
    pitch: 3.5
    type: push-in-spring (Cixi Kefa KF250-3.5-4P-1, C475156)
    labels: [VIN_12_32V, GND, RS485_A, RS485_B]
  pm_sensor:
    board: main
    poles: 6
    pitch: 1.5
    type: jst-zh-smd (JST B6B-ZR-SM4-TF -> harness -> Plantower PMSA003I 2x5 1.27 mm)
    labels: [+5V, GND, I2C_SDA, I2C_SCL, NC, NC]

checks:
  component_air_gap: 1.5
  component_to_cover_min_gap: 0.8

