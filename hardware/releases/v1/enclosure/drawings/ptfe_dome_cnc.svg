05.2" x2="374.0" y2="205.2" class="ext"/><text x="376.0" y="214.0" class="t">0.8</text><line x1="330.0" y1="380.0" x2="330.0" y2="181.2" class="axis"/><text x="40" y="430" class="n" xml:space="preserve">1. Shape: flange Ø 20.4 x 1.5, hemisphere SR 8.9 centred on the flange top face, wall 0.8 ±0.05 (inner SR 8.1, bore</text><text x="40" y="447" class="n" xml:space="preserve">    Ø 16.2).</text><text x="40" y="464" class="n" xml:space="preserve">2. Flange FLAT on both faces: top = O-ring face (18 x 1.0 mm O-ring squeezed 25 % against the crown lip), bottom =</text><text x="40" y="481" class="n" xml:space="preserve">    sits on the printed dome nut.</text><text x="40" y="498" class="n" xml:space="preserve">3. Tolerances: flange Ø 20.4 -0.1/+0 (bore Ø 20.8), flange faces flat/parallel 0.05, dome Ø 17.8 ±0.05.</text><text x="40" y="515" class="n" xml:space="preserve">4. Material: virgin (unfilled, non-porous) white PTFE. NOT glass/carbon-filled, NOT sintered optical PTFE. Blank: Ø</text><text x="40" y="532" class="n" xml:space="preserve">    22-25 mm virgin PTFE rod. CNC turning with a sphere profile outside and inside.</text><text x="40" y="549" class="n" xml:space="preserve">5. Order: PCBWay CNC turning (material PTFE, white) with the matching ptfe_dome_*.step + this drawing, an</text><text x="40" y="566" class="n" xml:space="preserve">    AliExpress custom-PTFE turning shop, or any lathe. Fine-turned matte finish; no polish (PTFE stays milky), no</text><text x="40" y="583" class="n" xml:space="preserve">    coating, no oil.</text><text x="40" y="600" class="n" xml:space="preserve">6. Diffuse transmission ~10-12 % at 250-1100 nm through the 0.8 mm wall (firmware optics_transmission 0.11).</text>
</svg>
